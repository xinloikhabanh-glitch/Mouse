name: Build Mouse Forge

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-msvc:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Compile resource (rc.exe)
        shell: cmd
        run: rc /fo resource.res resource.rc

      - name: Build MouseForge.exe (cl.exe)
        shell: cmd
        run: |
          cl /std:c++17 /EHsc /utf-8 /O2 /DUNICODE /D_UNICODE MouseForge.cpp resource.res /Fe:MouseForge.exe /link /SUBSYSTEM:WINDOWS user32.lib gdi32.lib comctl32.lib shlwapi.lib psapi.lib dwmapi.lib

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MouseForge-msvc
          path: MouseForge.exe
